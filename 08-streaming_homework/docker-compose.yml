services:
  # Redpanda: Kafka-compatible broker with stability tweaks for Codespaces
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --lock-memory=false
      - --check=false
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9093
    ports:
      - "9093:9092"

  # Flink JobManager (Master)
  jobmanager:
    image: flink:1.18.0-python3.10
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/opt/src/job/
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

  # Flink TaskManager (Worker)
  taskmanager:
    image: flink:1.18.0-python3.10
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2

  # PostgreSQL for storing results
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
